<article class="product-card" id="camisas-time">
    <div class="product-viewer">
        <img src="https://imgnike-a.akamaihd.net/768x768/10977200A4.jpg" id="main-img-time" class="main-display-img" alt="Camisa de Time">
        
        <div class="thumbnails">
            <img src="https://imgnike-a.akamaihd.net/768x768/10977200A4.jpg" onclick="changeImage(this.src)" alt="Miniatura 1">
            <img src="https://imgnike-a.akamaihd.net/768x768/10977200A6.jpg" onclick="changeImage(this.src)" alt="Miniatura 2">
            <img src="https://imgnike-a.akamaihd.net/768x768/10977200A3.jpg" onclick="changeImage(this.src)" alt="Miniatura 3">
            <img src="https://imgnike-a.akamaihd.net/768x768/10977200A8.jpg" onclick="changeImage(this.src)" alt="Miniatura 4">
            <img src="https://imgnike-a.akamaihd.net/768x768/10977200A5.jpg" onclick="changeImage(this.src)" alt="Miniatura 5">
        </div>
    </div>
    
    <div class="product-info">
        <h3>Camisa de Time Tailandesa</h3>
        <p class="price">R$ 180,00</p>
        <button class="buy-btn" onclick="addToCart()">Comprar</button>
    </div>
</article>

<script>
    function changeImage(src) {
        document.getElementById('main-img-time').src = src;
    }

    let count = 0;
    function addToCart() {
        count++;
        document.getElementById('cart-count').innerText = count;
        alert("Produto adicionado ao carrinho!");
    }
</script>
