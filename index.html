<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">TechStore</div>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Ofertas Incríveis</h1>
        <p>Os melhores gadgets com os melhores preços.</p>
    </section>

    <main class="container">
        <h2>Destaques</h2>
        <div class="product-grid">
            
            <div class="product-card">
                <div class="product-image"></div>
                <h3>Smartphone X1</h3>
                <p class="price">R$ 2.499,00</p>
                <button class="buy-btn">Comprar</button>
            </div>

            <div class="product-card">
                <div class="product-image"></div>
                <h3>Notebook Pro</h3>
                <p class="price">R$ 4.200,00</p>
                <button class="buy-btn">Comprar</button>
            </div>

            <div class="product-card">
                <div class="product-image"></div>
                <h3>Fone Bluetooth</h3>
                <p class="price">R$ 150,00</p>
                <button class="buy-btn">Comprar</button>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2024 TechStore - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
