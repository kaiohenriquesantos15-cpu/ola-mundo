<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3F STORE | Black & Purple Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <div class="logo">3F <span>STORE</span></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#camisas">Camisas</a></li>
                    <li><a href="#moletons">Moletons</a></li>
                    <li><a href="#calcas">Calças</a></li>
                    <li><a href="#shorts">Shorts</a></li>
                </ul>
            </nav>
            <div class="cart-icon">🛒 <span id="cart-count">0</span></div>
        </div>
    </header>

    <main class="container">
        
        <section id="camisas">
            <h2 class="section-title">Camisas <span>Estampadas</span></h2>
            <div class="product-grid">
                <article class="product-card">
                    <div class="product-viewer">
                        <div class="img-container">
                            <img src="https://static.bershka.net/assets/public/8dfe/1d63/e3a5403d878e/3fa9fd7635ca/01722734251-p/01722734251-p.jpg?ts=1773154344536&w=850&f=auto" id="img-camisa-est" class="main-display-img">
                        </div>
                        <div class="thumbnails">
                            <img src="https://static.bershka.net/assets/public/8dfe/1d63/e3a5403d878e/3fa9fd7635ca/01722734251-p/01722734251-p.jpg?ts=1773154344536&w=850&f=auto" onclick="changeImage('img-camisa-est', this.src)">
                            <img src="https://static.bershka.net/assets/public/9d90/8e81/2d614ac994c7/6735f60b375d/01722734251-a4o/01722734251-a4o.jpg?ts=1772200766761&w=850&f=auto" onclick="changeImage('img-camisa-est', this.src)">
                        </div>
                    </div>
                    <div class="product-info">
                        <h3>Camisa Graphic Edition</h3>
                        <p class="price">R$ 150,00</p>
                        <button class="buy-btn" onclick="addToCart()">Comprar</button>
                    </div>
                </article>
            </div>
        </section>

        <section id="moletons">
            <h2 class="section-title">Moletons <span>Premium</span></h2>
            <div class="product-grid">
                <article class="product-card">
                    <div class="product-viewer">
                        <div class="img-container">
                            <img src="https://static.bershka.net/assets/public/cded/b9bd/42c64dc68069/627620a66bdf/07369190812-p/07369190812-p.jpg?ts=1766408059832&w=850&f=auto" id="img-moletom-liso" class="main-display-img">
                        </div>
                        <div class="thumbnails">
                            <img src="https://static.bershka.net/assets/public/cded/b9bd/42c64dc68069/627620a66bdf/07369190812-p/07369190812-p.jpg?ts=1766408059832&w=850&f=auto" onclick="changeImage('img-moletom-liso', this.src)">
                            <img src="https://static.bershka.net/assets/public/ac56/ca02/6bbe4371b37c/3822bc2a687d/07369190812-a4o/07369190812-a4o.jpg?ts=1752748577913&w=850&f=auto" onclick="changeImage('img-moletom-liso', this.src)">
                        </div>
                    </div>
                    <div class="product-info">
                        <h3>Moletom Canguru Liso</h3>
                        <p class="price">R$ 220,00</p>
                        <button class="buy-btn" onclick="addToCart()">Comprar</button>
                    </div>
                </article>
            </div>
        </section>

        <section id="calcas">
            <h2 class="section-title">Calças <span>Streetwear</span></h2>
            <div class="product-grid">
                <article class="product-card">
                    <div class="product-viewer">
                        <div class="img-container">
                            <img src="https://static.bershka.net/assets/public/1d3a/f73e/622b43bda45e/1a5aca8bc1af/05350211800-a3o/05350211800-a3o.jpg?ts=1766410201549&w=850&f=auto" id="img-jeans" class="main-display-img">
                        </div>
                        <div class="thumbnails">
                            <img src="https://static.bershka.net/assets/public/1d3a/f73e/622b43bda45e/1a5aca8bc1af/05350211800-a3o/05350211800-a3o.jpg?ts=1766410201549&w=850&f=auto" onclick="changeImage('img-jeans', this.src)">
                            <img src="https://static.bershka.net/assets/public/a30b/f075/2bd54f37bc94/f35cc1b8037e/05350211800-a4o/05350211800-a4o.jpg?ts=1750152935081&w=850&f=auto" onclick="changeImage('img-jeans', this.src)">
                        </div>
                    </div>
                    <div class="product-info">
                        <h3>Calça Baggy Jeans</h3>
                        <p class="price">R$ 200,00</p>
                        <button class="buy-btn" onclick="addToCart()">Comprar</button>
                    </div>
                </article>
            </div>
        </section>

        <section id="shorts">
            <h2 class="section-title">Shorts <span>Verão</span></h2>
            <div class="product-grid">
                <p style="color: #666; font-style: italic; grid-column: 1/-1; text-align: center;">Novos produtos em breve.</p>
            </div>
        </section>

    </main>

    <script>
        function changeImage(targetId, src) {
            document.getElementById(targetId).src = src;
        }

        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
        }
    </script>
</body>
</html>
