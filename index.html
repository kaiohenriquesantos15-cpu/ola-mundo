<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3F STORE | Premium Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <div class="logo">3F <span>STORE</span></div>
            <nav class="nav-desktop">
                <a href="#camisas">Camisas</a>
                <a href="#moletons">Moletons</a>
                <a href="#calcas">Calças</a>
                <a href="#shorts">Shorts</a>
            </nav>
            <div class="cart-icon">CARRINHO (<span id="cart-count">0</span>)</div>
        </div>
    </header>

    <main class="container">
        
        <h2 class="section-title" id="camisas">Camisaria <span>Collection</span></h2>
        <div class="product-grid">
            
            <article class="product-card">
                <div class="product-viewer">
                    <div class="main-image-container">
                        <img src="https://static.bershka.net/assets/public/60d4/0761/ab8c4cbf9b1c/a420f861808e/00069154800-a2d/00069154800-a2d.jpg?ts=1771579451425&w=850&f=auto" id="img-lisa" class="main-display-img">
                    </div>
                    <div class="thumbnails-track">
                        <img src="https://static.bershka.net/assets/public/60d4/0761/ab8c4cbf9b1c/a420f861808e/00069154800-a2d/00069154800-a2d.jpg?ts=1771579451425&w=850&f=auto" onclick="changeImage('img-lisa', this.src)">
                        <img src="https://static.bershka.net/assets/public/5fd2/9b01/6e904e3a9534/43296ea8eb62/00069154800-a4o/00069154800-a4o.jpg?ts=1777561189280&w=850&f=auto" onclick="changeImage('img-lisa', this.src)">
                        <img src="https://static.bershka.net/assets/public/55e3/3ef2/cc0745deae40/f44c92f73e48/00069154800-b/00069154800-b.jpg?ts=1777561196309&w=850&f=auto" onclick="changeImage('img-lisa', this.src)">
                    </div>
                </div>
                <div class="product-details">
                    <h3>Camisa Lisa Premium</h3>
                    <p class="price">R$ 100,00</p>
                    <button class="buy-btn" onclick="addToCart()">ADICIONAR</button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-viewer">
                    <div class="main-image-container">
                        <img src="https://static.bershka.net/assets/public/8dfe/1d63/e3a5403d878e/3fa9fd7635ca/01722734251-p/01722734251-p.jpg?ts=1773154344536&w=850&f=auto" id="img-estampada" class="main-display-img">
                    </div>
                    <div class="thumbnails-track">
                        <img src="https://static.bershka.net/assets/public/8dfe/1d63/e3a5403d878e/3fa9fd7635ca/01722734251-p/01722734251-p.jpg?ts=1773154344536&w=850&f=auto" onclick="changeImage('img-estampada', this.src)">
                        <img src="https://static.bershka.net/assets/public/9d90/8e81/2d614ac994c7/6735f60b375d/01722734251-a4o/01722734251-a4o.jpg?ts=1772200766761&w=850&f=auto" onclick="changeImage('img-estampada', this.src)">
                        <img src="https://static.bershka.net/assets/public/ada0/7e10/b13344d793e1/d40430e47cf2/01722734251-b/01722734251-b.jpg?ts=1772200766796&w=850&f=auto" onclick="changeImage('img-estampada', this.src)">
                    </div>
                </div>
                <div class="product-details">
                    <h3>Camisa Estampada</h3>
                    <p class="price">R$ 150,00</p>
                    <button class="buy-btn" onclick="addToCart()">ADICIONAR</button>
                </div>
            </article>

        </div>

        <h2 class="section-title" id="calcas">Essentials <span>Pants</span></h2>
        <div class="product-grid">
            
            <article class="product-card">
                <div class="product-viewer">
                    <div class="main-image-container">
                        <img src="https://static.bershka.net/assets/public/1d3a/f73e/622b43bda45e/1a5aca8bc1af/05350211800-a3o/05350211800-a3o.jpg?ts=1766410201549&w=850&f=auto" id="img-jeans" class="main-display-img">
                    </div>
                    <div class="thumbnails-track">
                        <img src="https://static.bershka.net/assets/public/1d3a/f73e/622b43bda45e/1a5aca8bc1af/05350211800-a3o/05350211800-a3o.jpg?ts=1766410201549&w=850&f=auto" onclick="changeImage('img-jeans', this.src)">
                        <img src="https://static.bershka.net/assets/public/a30b/f075/2bd54f37bc94/f35cc1b8037e/05350211800-a4o/05350211800-a4o.jpg?ts=1750152935081&w=850&f=auto" onclick="changeImage('img-jeans', this.src)">
                        <img src="https://static.bershka.net/assets/public/d0bf/a3a2/21414effa7c2/98a9b525913a/05350211800-b/05350211800-b.jpg?ts=1750152935082&w=850&f=auto" onclick="changeImage('img-jeans', this.src)">
                    </div>
                </div>
                <div class="product-details">
                    <h3>Calça Jeans</h3>
                    <p class="price">R$ 200,00</p>
                    <button class="buy-btn" onclick="addToCart()">ADICIONAR</button>
                </div>
            </article>

        </div>
    </main>

    <script>
        function changeImage(targetId, src) {
            document.getElementById(targetId).src = src;
        }
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
        }
    </script>
</body>
</html>
